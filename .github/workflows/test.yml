name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  coordinator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 scripts/test-codex-decision.py
      - run: node --test scripts/run-ongoing-grounding.test.mjs
      - run: node --check scripts/run-ongoing.mjs
      - run: bash -n scripts/run-ongoing-lab.sh
      - run: node --test scripts/review-video.test.mjs
      - run: node --check scripts/run-jev-game.mjs
      - run: node --check scripts/run-claude-game.mjs
      - run: node diary/build.mjs --check
      - run: node diary/build.mjs
      - run: bash -n scripts/build-mod.sh scripts/run-lab.sh scripts/run-attention-lab.sh scripts/run-native-haul-lab.sh scripts/run-hauling-migration-lab.sh
# Real-game and mod builds require privately owned assemblies; intentionally not fetched in CI.
